# Filtro de luz cálida (hyprsunset).
# El daemon aplica el perfil cuyo `time` coincide con la hora actual y lo
# cambia solo al pasar al siguiente. `identity = true` deja la matriz sin
# tinte (sin filtro); `temperature` en Kelvin (más bajo = más cálido/naranja).

profile {
    time = 7:00
    identity = true
}

profile {
    time = 21:00
    temperature = 4500
}