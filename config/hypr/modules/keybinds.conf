###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, C, exec, $editor

bind = $mainMod, Z, exec, zed
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, PERIOD, exec, ~/.local/bin/wofi-emoji # Emojis con SUPER + .
bind = $mainMod, W, exec, ~/.local/bin/wifi-menu # Menú Wi-Fi con SUPER + W
bind = $mainMod, F5, exec, pkill -USR1 -f '^bash .*wifi-menu$' # Re-scanear menú Wi-Fi abierto
bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, J, togglesplit, # dwindle (deprecated)
bind = $mainMod, F, fullscreen, toggle

# Screen lock bind
bind = $mainMod, F6, exec, hyprlock
bind = $mainMod SHIFT, F6, exec, hyprctl dispatch dpms toggle # Apaga/enciende la pantalla

# Silenciar audio con SUPER + F10
bind = $mainMod, F10, exec, swayosd-client --output-volume mute-toggle

# Luz cálida: toggle del filtro hyprsunset con SUPER + F9
bind = $mainMod, F9, exec, ~/.config/waybar/scripts/hyprsunset.sh toggle

# Partial screenshot bind and notification (guarda en ~/Pictures y copia al portapapeles)
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | tee ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png | wl-copy && notify-send "Screenshot taken" || notify-send "Screenshot cancelled"

# Scripts
bind = $mainMod SHIFT, W, exec, ~/.local/bin/reload-waybar # Reload Waybar
bind = $mainMod SHIFT, Q, exec, killall waybar # Kill Waybar
bind = $mainMod SHIFT, R, exec, hyprctl reload # Reload Hyprlandzzzzz

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move windows with arrow keys + SHIFT + mainMod
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize windows with mainMod + CTRL + arrows
bind = $mainMod CTRL, right, resizeactive, 40 0
bind = $mainMod CTRL, left, resizeactive, -40 0
bind = $mainMod CTRL, down, resizeactive, 0 40
bind = $mainMod CTRL, up, resizeactive, 0 -40

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Brillo con SUPER + F1/F2
bindl = $mainMod, F1, exec, swayosd-client --brightness -5
bindl = $mainMod, F2, exec, swayosd-client --brightness +5

# Volumen con SUPER + F11/F12
bindl = $mainMod, F11, exec, swayosd-client --output-volume -5
bindl = $mainMod, F12, exec, swayosd-client --output-volume +5

# Laptop multimedia keys for volume and LCD brightness
bindl = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5
bindl = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bind = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindl = ,XF86MonBrightnessUp, exec, swayosd-client --brightness +5
bindl = ,XF86MonBrightnessDown, exec, swayosd-client --brightness -5

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
