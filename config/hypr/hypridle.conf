general {
    # lock_cmd = notify-send "lock!"          # dbus/sysd lock command (loginctl lock-session)
    # unlock_cmd = notify-send "unlock!"      # same as above, but unlock
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    # lock_cmd = pidof hyprlock || hyprlock # avoid starting multiple hyprlock instances.
    # before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'  # to avoid having to press a key twice to turn on the display.
}

# Screenlock
listener {
    timeout = 600                            # in seconds (10 min)
    on-timeout = hyprlock # command to run when timeout has passed
    on-resume = notify-send "Welcome back to your desktop!"  # command to run when activity is detected after timeout has fired.
}

# Apagar la pantalla
# OJO: `hyprctl dispatch dpms on|off` es sintaxis hyprlang y con config Lua
# hyprctl la envuelve como `hl.dispatch(dpms off)`, que no es Lua válido (falla).
# La forma correcta es pasar una expresión Lua: `hl.dsp.dpms({ action = ... })`,
# donde action admite "on"/"off"/"toggle" (o "enable"/"disable").
listener {
    timeout = 900                            # in seconds (15 min)
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'   # apaga la pantalla
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'     # la vuelve a encender
}

# Suspend
listener {
    timeout = 1200                           # in seconds (20 min)
    on-timeout = systemctl suspend # command to run when timeout has passed
    on-resume = notify-send "Welcome back to your desktop!"  # command to run when activity is detected after timeout has fired.
}
